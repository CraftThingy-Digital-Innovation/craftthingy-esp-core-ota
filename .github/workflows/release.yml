name: Build and Release Core Firmware

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Board Firmware & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex cryptography

      - name: Build All Board Targets
        run: |
          pio run -e esp01_1m
          pio run -e esp32dev
          pio run -e esp32s3
          pio run -e esp32c3
          pio run -e esp32s2

      - name: Package Firmware Binaries & Calculate Hashes
        run: |
          mkdir -p release_assets
          cp .pio/build/esp01_1m/firmware.bin release_assets/firmware-esp01s.bin
          cp .pio/build/esp32dev/firmware.bin release_assets/firmware-esp32.bin
          cp .pio/build/esp32s3/firmware.bin release_assets/firmware-esp32s3.bin
          cp .pio/build/esp32c3/firmware.bin release_assets/firmware-esp32c3.bin
          cp .pio/build/esp32s2/firmware.bin release_assets/firmware-esp32s2.bin
          
          cd release_assets
          for f in *.bin; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Determine Target Tag & Generate Rich Release Notes
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          cat << EOF > release_notes.md
          ## 🚀 CraftThingy ESP Core OTA Framework - ${TAG}

          Official production release of the foundational embedded OTA and security framework for the **CraftThingy Digital Innovation** ecosystem.

          ### 📦 Pre-Compiled Firmware Binaries
          Download the appropriate binary matching your hardware target:

          | Target Board | Architecture | Flash Size / Mode | Asset Name | Checksum |
          |---|---|---|---|---|
          | **ESP-01 / ESP-01S** | ESP8266EX | 1MB / DOUT (512K+512K OTA) | \`firmware-esp01s.bin\` | \`.sha256\` |
          | **ESP32 Standard** | Dual-Core Xtensa | 4MB+ / DIO (1.9MB OTA) | \`firmware-esp32.bin\` | \`.sha256\` |
          | **ESP32-S3** | Dual-Core Xtensa | 8MB / QIO (OTA) | \`firmware-esp32s3.bin\` | \`.sha256\` |
          | **ESP32-C3** | Single-Core RISC-V | 4MB / DIO (OTA) | \`firmware-esp32c3.bin\` | \`.sha256\` |
          | **ESP32-S2** | Single-Core Xtensa | 4MB / DIO (OTA) | \`firmware-esp32s2.bin\` | \`.sha256\` |

          ---

          ### ⚡ Installation & Flashing Instructions

          #### 1. First-Time USB Flashing (\`flash_tool.py\`)
          \`\`\`bash
          # Probe connected board
          python tools/flash_tool.py probe

          # Flash ESP-01 / ESP-01S
          python tools/flash_tool.py flash --bin firmware-esp01s.bin
          \`\`\`

          #### 2. Over-The-Air (OTA) Updates
          Devices running \`craftthingy-esp-core-ota\` automatically check for updates every hour, or immediately via the REST API (\`POST /api/v1/ota/check\`) and the browser dashboard (\`esp_manager.html\`).

          ---

          ### 🔐 Security & Integrity
          All binaries include companion \`.sha256\` checksum files. Verify integrity before flashing:
          \`\`\`bash
          sha256sum -c firmware-esp01s.bin.sha256
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CraftThingy Core OTA Framework ${{ steps.release_meta.outputs.tag }}"
          tag_name: ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
