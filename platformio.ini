; =================================================================
; CraftThingy Digital Innovation - Universal OTA & Device Framework
; Supports: ESP8266 (ESP-01, ESP-01S 1MB Flash) & All ESP32 Variants
; =================================================================

[platformio]
default_envs = esp01_1m, esp32dev, esp32s3, esp32c3
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    ; Zero bloated external dependencies - all core logic uses native 
    ; mbedTLS (ESP32) and BearSSL (ESP8266) with built-in networking.
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CRAFTTHINGY_VERSION=\"1.0.0\"
    -D CRAFTTHINGY_ORG=\"CraftThingy-Digital-Innovation\"

; -----------------------------------------------------------------
; ESP8266: ESP-01 & ESP-01S (1MB Flash, strictly memory-optimized)
; -----------------------------------------------------------------
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld   ; 1MB flash: ~896KB sketch / OTA slot, 64KB LittleFS
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp8266\"
    -D ASSET_TAG=\"esp8266\"
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
    -D BEARSSL_SSL_BASIC
    -Os
    -Wl,-Map,firmware.map

; -----------------------------------------------------------------
; Generic ESP32 (WROOM-32, ESP32-DevKit, all dual-core variants)
; -----------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv      ; 1.9MB app0 / 1.9MB app1 OTA scheme
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32\"
    -D ASSET_TAG=\"esp32\"
    -Os

; -----------------------------------------------------------------
; ESP32-S3 (Dual-core Xtensa, USB-OTG, AI/Camera)
; -----------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = default_8MB.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32s3\"
    -D ASSET_TAG=\"esp32s3\"
    -Os

; -----------------------------------------------------------------
; ESP32-C3 (RISC-V Single-core, low power IoT)
; -----------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32c3\"
    -D ASSET_TAG=\"esp32c3\"
    -Os

; -----------------------------------------------------------------
; ESP32-S2 (Single-core Xtensa, USB native)
; -----------------------------------------------------------------
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32s2\"
    -D ASSET_TAG=\"esp32s2\"
    -Os
